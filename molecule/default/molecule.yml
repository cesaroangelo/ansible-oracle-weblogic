---
driver:
  name: docker

platforms:
  - name: el8
    image: geerlingguy/docker-rockylinux8-ansible:latest
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: el9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        weblogic_installer: /opt/media/fmw_14.1.2.0.0_wls_generic.jar
        weblogic_installer_remote_src: true
        weblogic_jdk_archive: /opt/media/jdk.tar.gz
        weblogic_jdk_archive_remote_src: true
        weblogic_admin_password: Molecule-Pw-1
        weblogic_domain_name: test_domain
        weblogic_wait_timeout: 60

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
